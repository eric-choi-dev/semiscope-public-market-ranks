name: Daily US market ranks
on:
  schedule:
    - cron: '17 7 * * *'
    - cron: '41 15 * * *'
  workflow_dispatch:
    inputs:
      audit_quality:
        description: Recheck the dated large-cap roster, filings and sampled closing prices from their sources
        type: boolean
        default: false
      verify_current:
        description: Rebuild the current market day and verify its public release
        type: boolean
        default: false
      migrate_unified:
        description: Rebuild the integrated long-term index for both holding-period views
        type: boolean
        default: false
      expected_content_sha256:
        description: Content digest printed by the independent unified candidate review
        type: string
        required: false

concurrency:
  group: public-rank-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit_large_cap:
    if: github.ref == 'refs/heads/main' && inputs.audit_quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compare the original filings and pinned prices with the published sample
        run: node scripts/refresh-large-cap-universe.mjs --cache "$RUNNER_TEMP/semiscope-quality" --public-dir quality --audit-sources
  publish:
    if: github.ref == 'refs/heads/main' && !inputs.audit_quality
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - name: Read the reviewed calculation code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare the on-demand market database reader
        id: market_tools
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rank-dolt-command" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          release="$RUNNER_TEMP/rank-dolt"
          if [ ! -x "$release/dolt-linux-amd64/bin/dolt" ]; then
            mkdir -p "$release"
            curl --fail --location --retry 3 --silent --show-error \
              https://github.com/dolthub/dolt/releases/download/v2.7.6/dolt-linux-amd64.tar.gz \
              --output "$release/dolt.tar.gz"
            echo "02479bf57f3c46c46c4f6977e948d56e88f5ee5f2a73da8226e7ebc31039639e  $release/dolt.tar.gz" | sha256sum --check --status
            tar -xzf "$release/dolt.tar.gz" -C "$release" dolt-linux-amd64/bin/dolt
          fi
          exec "$release/dolt-linux-amd64/bin/dolt" "$@"
          SH
          chmod 700 "$RUNNER_TEMP/rank-dolt-command"
          echo "DOLT_EXECUTABLE=$RUNNER_TEMP/rank-dolt-command" >> "$GITHUB_ENV"
      - name: Score and verify the public numerical release
        env:
          RANK_PUBLISH_TOKEN: ${{ secrets.RANK_PUBLISH_TOKEN }}
          VERIFY_CURRENT: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_current }}
          MIGRATE_UNIFIED: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate_unified }}
          EXPECTED_CONTENT_SHA256: ${{ inputs.expected_content_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MIGRATE_UNIFIED" = "true" ]; then
            node scripts/refresh-cloud-ranks.mjs --migrate-unified --expected-content-sha256 "$EXPECTED_CONTENT_SHA256"
          elif [ "$VERIFY_CURRENT" = "true" ]; then
            node scripts/refresh-cloud-ranks.mjs --verify-current
          else
            node scripts/refresh-cloud-ranks.mjs
          fi
      - name: Record the verified publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s last-run.json
          # gh supplies its ephemeral token through its credential helper only during push.
          git add -- last-run.json
          if [ -f last-directory.json.gz ]; then git add -- last-directory.json.gz; fi
          if [ -d pending-directories ]; then git add -A -- pending-directories; fi
          if git diff --staged --quiet --; then exit 0; fi
          git -c user.name=Semiscope -c user.email=semiscope@users.noreply.github.com commit -m 'Record verified public market ranks'
          git -c credential.helper= -c 'credential.https://github.com.helper=!gh auth git-credential' push origin HEAD:main
      - name: Prepare the runtime for SEC bulk archive verification
        if: ${{ !inputs.verify_current && !inputs.migrate_unified }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Match S&P 500 members and reported shares to the published price day
        if: ${{ !inputs.verify_current && !inputs.migrate_unified }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refresh-large-cap-universe.mjs --cache "$RUNNER_TEMP/semiscope-quality-sec" --public-dir quality \
            --db "${RANK_CACHE_DIR:-/tmp/semiscope-rank-cache}/stockdb" --dolt "$DOLT_EXECUTABLE" --fetch-db
          node --test scripts/test-large-cap-universe.mjs scripts/test-quality-sec-metrics.mjs
      - name: Publish the dated large-cap screen
        if: ${{ !inputs.verify_current && !inputs.migrate_unified }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- quality/
          if git diff --staged --quiet --; then exit 0; fi
          git -c user.name=Semiscope -c user.email=semiscope@users.noreply.github.com commit -m 'Publish the dated S&P 500 large-cap screen'
          git -c credential.helper= -c 'credential.https://github.com.helper=!gh auth git-credential' push origin HEAD:main
      - name: Verify new regular sessions in the independent price history
        id: history_delta
        if: ${{ !cancelled() && steps.market_tools.outcome == 'success' && !inputs.verify_current && !inputs.migrate_unified }}
        shell: bash
        run: |
          set -euo pipefail
          delta_checkout="$RUNNER_TEMP/semiscope-history-deltas"
          git clone --quiet --depth=1 --single-branch --branch history-deltas \
            'https://github.com/eric-choi-dev/semiscope-public-market-ranks.git' "$delta_checkout"
          node scripts/refresh-history-deltas.mjs --checkout "$delta_checkout"
      - name: Fast-forward only the public price-data branch
        if: ${{ !cancelled() && steps.history_delta.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/semiscope-history-deltas"
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/history-deltas)" ]; then exit 0; fi
          git merge-base --is-ancestor origin/history-deltas HEAD
          git -c credential.helper= -c 'credential.https://github.com.helper=!gh auth git-credential' push origin HEAD:refs/heads/history-deltas
